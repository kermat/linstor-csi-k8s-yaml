apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rd
  labels:
    app: redis
spec:
  serviceName: "redis"
  replicas: 3
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
      - name: config
        image: redis:7
        command: ["sh", "-c"]
        args:
        - |
          ORDINAL=$(hostname | rev | cut -d- -f1 | rev)
          if [ "$ORDINAL" = "0" ]; then
            echo "appendonly yes" > /etc/redis/redis.conf
          else
            echo "appendonly yes" > /etc/redis/redis.conf
            echo "replicaof rd-0.redis 6379" >> /etc/redis/redis.conf
          fi
        volumeMounts:
        - name: config
          mountPath: /etc/redis
      containers:
      - name: redis
        image: redis:7
        command: ["redis-server", "/etc/redis/redis.conf"]
        ports:
        - containerPort: 6379
          name: peer
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "redis-cli -h $(hostname) ping"
          initialDelaySeconds: 15
          timeoutSeconds: 5
        volumeMounts:
        - name: datadir
          mountPath: /data
        - name: config
          mountPath: /etc/redis
      volumes:
      - name: config
        emptyDir: {}
  volumeClaimTemplates:
  - metadata:
      name: datadir
    spec:
      storageClassName: linstor-csi-lvm-thin-r1
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1G
---
# A headless service to create DNS records
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  ports:
  - port: 6379
    name: peer
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: redis
